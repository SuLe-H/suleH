<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MJ 超级终端 & 虚拟手机</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        .hide, .hidden { display: none !important; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-image: url('https://a1.boltp.com/2026/03/08/69ac676d96837.jpg'); background-size: cover; background-position: center; background-attachment: fixed; color: #1e293b;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }

        .glass { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-right: 1px solid rgba(255, 255, 255, 0.3); border-bottom: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1); }
        .glass-card { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 4px 16px 0 rgba(0, 0, 0, 0.05); transition: all 0.3s; }
        .glass-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px 0 rgba(0, 0, 0, 0.15); border: 1px solid rgba(255, 255, 255, 0.9); background: rgba(255, 255, 255, 0.75); }
        .card-image-container { height: 140px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.05); }
        .card-image-container img { width: 100%; height: 100%; object-fit: cover; }
        .sortable-ghost { opacity: 0.3; transform: scale(0.95); }
        
        @keyframes fadeSlideUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeSlideUp 0.4s ease forwards; opacity: 0; }
        @keyframes scaleIn { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
        .modal-animate { animation: scaleIn 0.2s ease forwards; }
        .btn-hover { transition: all 0.2s; cursor: pointer; }
        .btn-hover:active { transform: scale(0.95); }

        /* 手机框架UI */
        .phone-frame {
            width: 360px; height: 740px; background: #f3f4f6; border-radius: 40px;
            box-shadow: 0 0 0 10px #1f2937, 0 20px 40px rgba(0,0,0,0.4);
            position: relative; overflow: hidden; display: flex; flex-direction: column; transition: all 0.3s ease;
        }
        /* 全屏无边框模式附加样式 */
        .phone-frame.is-fullscreen {
            width: 100%; height: 100%; border-radius: 0; box-shadow: none;
        }
        .phone-frame.is-fullscreen .phone-notch { display: none !important; }

        .phone-notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 120px; height: 25px; background: #1f2937; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; z-index: 50;}
        .phone-content { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; }
        .bubble-left { background: #ffffff; border: 1px solid #e5e7eb; color: #1f2937; border-radius: 16px 16px 16px 4px; padding: 10px 14px; max-width: 80%; width: fit-content; word-break: break-word; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); user-select: none; -webkit-user-select: none; cursor: pointer;}
        .bubble-right { background: #4f46e5; color: white; border-radius: 16px 16px 4px 16px; padding: 10px 14px; max-width: 80%; width: fit-content; word-break: break-word; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); margin-left: auto; user-select: none; -webkit-user-select: none; cursor: pointer;}
        .bubble-left:active, .bubble-right:active { filter: brightness(0.9); }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #4f46e5; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; display: inline-block;}
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* 移动后的退出按钮：左侧中间小拉环 */
        .tiny-exit-btn {
            position: fixed; top: 50%; left: 0; width: 24px; height: 48px; transform: translateY(-50%);
            background: rgba(0,0,0,0.25); backdrop-filter: blur(4px); border-radius: 0 12px 12px 0;
            display: flex; align-items: center; justify-content: center; z-index: 100;
            color: rgba(255,255,255,0.8); cursor: pointer; transition: all 0.2s; border: 1px solid rgba(255,255,255,0.2); border-left: none;
        }
        .tiny-exit-btn:hover { background: rgba(0,0,0,0.5); color: white; padding-left: 4px; width: 28px; }
    </style>
</head>
<body class="h-screen flex overflow-hidden relative">

    <div id="sidebar-overlay" class="fixed inset-0 bg-black/30 z-20 hidden md:hidden backdrop-blur-sm" onclick="closeSidebar()"></div>

    <!-- 侧边栏 -->
    <aside id="sidebar" class="w-64 glass flex flex-col h-full z-30 absolute md:relative transform -translate-x-full md:translate-x-0 transition-transform duration-300">
        <div class="p-4 border-b border-white/30 flex flex-col gap-3">
            <div class="flex items-center justify-between">
                <h1 class="text-xl font-bold flex items-center gap-2 text-indigo-800 drop-shadow-sm">超级终端</h1>
                <button class="md:hidden text-slate-700 btn-hover z-50" onclick="closeSidebar()">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <!-- 导航菜单 -->
            <div class="space-y-1">
                <button onclick="switchMode('pvalue')" id="nav-pvalue" class="nav-btn w-full text-left px-3 py-2 rounded-lg font-medium text-sm flex items-center gap-2 transition"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg> P值库</button>
                <button onclick="switchMode('prompt')" id="nav-prompt" class="nav-btn w-full text-left px-3 py-2 rounded-lg font-medium text-sm flex items-center gap-2 transition"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 00-2-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg> 词包库</button>
                <button onclick="switchMode('theater')" id="nav-theater" class="nav-btn w-full text-left px-3 py-2 rounded-lg font-medium text-sm flex items-center gap-2 transition"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg> Mufy小剧场</button>
                <button onclick="switchMode('web')" id="nav-web" class="nav-btn w-full text-left px-3 py-2 rounded-lg font-medium text-sm flex items-center gap-2 transition"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg> 网页预览</button>
                <button onclick="switchMode('phone')" id="nav-phone" class="nav-btn w-full text-left px-3 py-2 rounded-lg font-medium text-sm flex items-center gap-2 transition"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg> 虚拟手机</button>
            </div>
        </div>
        <div class="p-3 flex-1 overflow-y-auto z-40" id="category-area">
            <div id="category-list"></div>
        </div>
        <div class="p-4 border-t border-white/30" id="add-cat-area">
            <button onclick="addCategory()" class="btn-hover w-full py-2 px-4 bg-white/50 hover:bg-white/80 text-slate-800 font-medium rounded-xl flex items-center justify-center gap-2 shadow-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg> 新建分类
            </button>
        </div>
    </aside>

    <!-- 主内容区 -->
    <main class="flex-1 flex flex-col h-full relative z-10">
        <!-- 退回到选择界面按钮 (移到左侧垂直居中) -->
        <button id="phone-exit-btn" onclick="openSidebar()" class="tiny-exit-btn hide" title="唤出菜单">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path></svg>
        </button>

        <header id="main-header" class="min-h-[4rem] md:h-20 py-3 md:py-0 glass flex flex-col md:flex-row items-start md:items-center justify-between px-4 md:px-8 z-10 gap-3 md:gap-0">
            <div class="flex items-center gap-3 w-full md:w-auto">
                <button onclick="openSidebar()" class="btn-hover md:hidden text-slate-800 bg-white/30 p-1.5 rounded-lg border border-white/40"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
                <h2 class="text-xl md:text-2xl font-bold flex-1 truncate drop-shadow-sm text-slate-800" id="current-category-title">全部</h2>
            </div>
            <div id="normal-action-bar" class="flex gap-2 w-full md:w-auto justify-end">
                <button onclick="toggleSelectMode()" class="btn-hover px-3 py-2 text-sm bg-white/50 rounded-xl font-medium shadow-sm">多选</button>
                <button onclick="openAddModal()" class="btn-hover px-3 py-2 text-sm bg-indigo-600/90 text-white rounded-xl font-medium shadow-lg" id="btn-add-main">添加内容</button>
            </div>
            <div id="bulk-action-bar" class="hide flex flex-wrap justify-end gap-2 items-center w-full md:w-auto">
                <span class="text-sm text-slate-700 font-medium mr-2" id="selected-count">已选择 0 项</span>
                <button onclick="selectAll()" class="btn-hover px-3 py-1.5 text-sm bg-white/50 rounded-xl shadow-sm">全选</button>
                <button onclick="bulkMove()" class="btn-hover px-3 py-1.5 text-sm bg-blue-100/60 text-blue-700 rounded-xl shadow-sm">移动</button>
                <button onclick="bulkDelete()" class="btn-hover px-3 py-1.5 text-sm bg-red-100/60 text-red-700 rounded-xl shadow-sm">删除</button>
                <button onclick="toggleSelectMode()" class="btn-hover px-3 py-1.5 text-sm bg-white/50 rounded-xl shadow-sm">取消</button>
            </div>
        </header>

        <div id="grid-container" class="flex-1 overflow-y-auto p-4 md:p-8">
            <div id="item-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 pb-20"></div>
            <div id="empty-state" class="hide flex flex-col items-center justify-center h-full text-slate-600 pb-20">
                <p class="font-medium text-lg mt-4" id="empty-text">这里空空如也</p>
            </div>
        </div>

        <div id="phone-app-container" class="hide flex-1 items-center justify-center bg-black/40 backdrop-blur-md overflow-hidden p-4 relative">
            <div class="phone-frame" id="phone-root"></div>
        </div>
    </main>

    <!-- 通用添加/编辑弹窗 -->
    <div id="modal-universal" class="hide fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" onclick="closeModal('modal-universal')"></div>
        <div class="glass modal-animate rounded-2xl w-full max-w-lg p-5 md:p-6 shadow-2xl relative border border-white/60 max-h-[90vh] flex flex-col z-10">
            <h3 class="text-xl font-bold mb-4 text-slate-800 flex-shrink-0" id="uni-title">添加</h3>
            <div class="space-y-4 overflow-y-auto flex-1 pr-2 pb-2">
                <div id="uni-fields-container" class="space-y-4"></div>
                <div><label class="block text-sm font-semibold text-slate-700 mb-1">所属分类</label><select id="uni-input-category" class="w-full px-4 py-2 bg-white/70 rounded-xl focus:ring-2 focus:ring-indigo-400 focus:outline-none"></select></div>
            </div>
            <div class="mt-6 flex justify-end gap-3 flex-shrink-0">
                <button onclick="closeModal('modal-universal')" class="btn-hover px-4 py-2 text-slate-700 bg-white/50 rounded-xl font-medium">取消</button>
                <button onclick="saveUniversal()" class="btn-hover px-4 py-2 bg-indigo-600/90 text-white rounded-xl font-medium">保存</button>
            </div>
        </div>
    </div>

    <!-- 独立还原：词包/小剧场 查看详情弹窗 (阅读面板) -->
    <div id="modal-view-prompt" class="hide fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeModal('modal-view-prompt')"></div>
        <div class="glass modal-animate rounded-2xl w-full max-w-lg shadow-2xl relative border border-white/60 flex flex-col overflow-hidden max-h-[90vh] z-10">
            <div class="h-40 bg-slate-200 relative w-full">
                <img id="view-prompt-img" src="" class="w-full h-full object-cover hide">
                <div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent"></div>
                <div class="absolute bottom-4 left-5 right-5 flex justify-between items-end">
                    <h3 id="view-prompt-title" class="text-2xl font-bold text-white drop-shadow-md truncate pr-2">名称</h3>
                    <span id="view-prompt-cat" class="text-xs font-medium text-white/90 bg-white/20 px-2 py-1 rounded backdrop-blur-md border border-white/30 whitespace-nowrap">分类</span>
                </div>
                <button onclick="closeModal('modal-view-prompt')" class="btn-hover absolute top-4 right-4 text-white bg-black/20 hover:bg-black/40 p-1.5 rounded-full backdrop-blur-md transition z-20">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-5 bg-white/40">
                <div id="view-prompt-list" class="space-y-3"></div>
            </div>
            <div class="p-4 border-t border-white/40 bg-white/50 backdrop-blur-md">
                <button onclick="copyAllPrompts()" class="btn-hover w-full py-3 bg-indigo-600/90 text-white rounded-xl hover:bg-indigo-600 shadow-md font-bold flex justify-center items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg> 一键复制全部内容
                </button>
            </div>
        </div>
    </div>

    <!-- 网页预览弹窗 -->
    <div id="modal-iframe" class="hide fixed inset-0 z-50 flex flex-col p-4 md:p-10">
        <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-md" onclick="closeModal('modal-iframe')"></div>
        <div class="relative flex-1 bg-white rounded-xl overflow-hidden shadow-2xl flex flex-col z-10 modal-animate">
            <div class="h-12 bg-slate-100 flex items-center justify-between px-4 border-b">
                <div class="flex items-center gap-2 text-sm text-slate-600 font-mono truncate" id="iframe-url-display">https://...</div>
                <div class="flex items-center gap-2">
                    <button class="btn-hover p-1.5 bg-blue-50 text-blue-600 rounded-lg text-sm font-medium flex items-center gap-1" id="iframe-open-btn"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg> 新标签页</button>
                    <button onclick="closeModal('modal-iframe')" class="btn-hover p-1 text-slate-400 hover:text-red-500 rounded"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                </div>
            </div>
            <iframe id="preview-iframe" class="flex-1 w-full bg-white border-0"></iframe>
        </div>
    </div>

    <!-- 手机：日记大图/详情弹窗 -->
    <div id="modal-diary-detail" class="hide fixed inset-0 z-[60] flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm" onclick="closeModal('modal-diary-detail')"></div>
        <div class="bg-white modal-animate rounded-2xl w-full max-w-sm p-6 shadow-2xl relative z-10 max-h-[80vh] flex flex-col">
            <div class="flex items-center gap-3 mb-4 pb-3 border-b border-slate-100 shrink-0">
                <img id="dd-avatar" src="" class="w-10 h-10 rounded-full object-cover bg-slate-200">
                <div><div id="dd-name" class="font-bold text-slate-800">名字</div><div id="dd-date" class="text-xs text-slate-400">日期</div></div>
            </div>
            <div id="dd-content" class="text-slate-700 text-sm leading-relaxed overflow-y-auto flex-1 whitespace-pre-wrap">内容</div>
            <button onclick="closeModal('modal-diary-detail')" class="mt-4 w-full py-2 bg-slate-100 hover:bg-slate-200 rounded-xl font-medium text-slate-600 transition shrink-0">关闭</button>
        </div>
    </div>

    <!-- 手机：聊天长按菜单 -->
    <div id="modal-msg-context" class="hide fixed inset-0 z-[70] flex items-end justify-center p-4 pb-10">
        <div class="absolute inset-0 bg-black/20 backdrop-blur-sm" onclick="closeMsgContextMenu()"></div>
        <div class="bg-white rounded-2xl w-full max-w-[320px] p-2 shadow-2xl relative z-10 modal-animate flex flex-col gap-1">
            <button class="w-full py-3 text-slate-700 font-medium hover:bg-slate-50 rounded-xl" onclick="msgActionCopy()">复制</button>
            <button class="w-full py-3 text-slate-700 font-medium hover:bg-slate-50 rounded-xl" onclick="msgActionQuote()">引用</button>
            <button class="w-full py-3 text-slate-700 font-medium hover:bg-slate-50 rounded-xl" onclick="msgActionSelect()">多选</button>
            <div class="h-px bg-slate-100 my-1"></div>
            <button class="w-full py-3 text-red-500 font-bold hover:bg-red-50 rounded-xl" onclick="msgActionDelete()">删除</button>
            <div class="h-2 bg-slate-50 -mx-2 my-1"></div>
            <button class="w-full py-3 text-slate-400 font-bold hover:bg-slate-50 rounded-xl" onclick="closeMsgContextMenu()">取消</button>
        </div>
    </div>

    <div id="toast" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-slate-800/90 backdrop-blur-md text-white px-6 py-3 rounded-2xl shadow-xl transition-all duration-300 opacity-0 pointer-events-none z-[999] text-sm whitespace-nowrap"></div>

    <script>
        // --- 核心数据 ---
        let state = {
            mode: 'pvalue',
            selectMode: false,
            selectedIds: new Set(),
            pvalue: { categories: ['默认分类'], items: [], currentCategory: '全部' },
            prompt: { categories: ['默认分类'], items: [], currentCategory: '全部' },
            theater: { categories: ['灵本'], items: [], currentCategory: '全部' },
            web: { categories: ['常用网址'], items: [], currentCategory: '全部' },
            phone: {
                api: { baseUrl: 'https://api.openai.com/v1', key: '', model: 'gpt-4o-mini' },
                userPersona: '',
                characters: [{id: 'char_1', name: 'AI助手', avatar: '', persona: '你是一个乐于助人的智能助手。', customUserPersona: '', chatBg: '', offlineEnabled: false, offlineMin: 200, offlineMax: 5000}],
                chats: { 'char_1': [] },
                settings: { fullScreen: false }, // 新增全屏无边框控制
                theme: { wallpaper: '', iconContacts: '', iconSettings: '', iconDiary: '' },
                diaries: []
            }
        };

        let editingId = null;
        let phoneUIState = { 
            screen: 'home', activeCharId: null, chatSelectMode: false,
            selectedChatIds: new Set(), quotingMsgId: null, contextMsgId: null 
        };
        
        let currentViewingPrompts = [];

        function init() {
            try {
                const saved = localStorage.getItem('mj_super_terminal');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state = { ...state, ...parsed };
                    if(!state.phone.theme) state.phone.theme = { wallpaper: '', iconContacts: '', iconSettings: '', iconDiary: '' };
                    if(!state.phone.diaries) state.phone.diaries = [];
                    if(!state.phone.settings) state.phone.settings = { fullScreen: false };
                    if(state.phone.settings.fullScreen === undefined) state.phone.settings.fullScreen = false;
                    state.phone.characters = state.phone.characters.map(c => ({ 
                        customUserPersona: '', chatBg: '', offlineEnabled: false, offlineMin: 200, offlineMax: 5000, ...c 
                    }));
                }
            } catch(e) {}

            if(state.phone && state.phone.chats) {
                Object.keys(state.phone.chats).forEach(k => {
                    state.phone.chats[k] = state.phone.chats[k].map((m, i) => {
                        if(!m.id) m.id = 'msg_' + Date.now() + '_' + i + '_' + Math.random().toString(36).substr(2,5);
                        return m;
                    });
                });
            }
            
            if(typeof Sortable !== 'undefined') {
                new Sortable(document.getElementById('item-grid'), {
                    animation: 250, delay: 200, delayOnTouchOnly: true, ghostClass: 'sortable-ghost',
                    onEnd: function () {
                        if(state.mode === 'phone') return;
                        const gridItems = Array.from(document.querySelectorAll('.p-card'));
                        const newOrder = gridItems.map(item => item.dataset.id);
                        const db = state[state.mode];
                        let newItems = [];
                        const otherItems = db.items.filter(i => db.currentCategory !== '全部' && i.category !== db.currentCategory);
                        newOrder.forEach(id => { const f = db.items.find(i=>i.id==id); if(f) newItems.push(f); });
                        db.items = db.currentCategory === '全部' ? newItems : [...newItems, ...otherItems];
                        saveData();
                    }
                });
            }
            applyPhoneFullScreen();
            switchMode(state.mode);
        }

        function saveData() { try { localStorage.setItem('mj_super_terminal', JSON.stringify(state)); } catch(e){} }

        function applyPhoneFullScreen() {
            const container = document.getElementById('phone-app-container');
            const root = document.getElementById('phone-root');
            if(state.phone.settings.fullScreen) {
                container.classList.remove('p-4');
                root.classList.add('is-fullscreen');
            } else {
                container.classList.add('p-4');
                root.classList.remove('is-fullscreen');
            }
        }

        function switchMode(newMode) {
            state.mode = newMode;
            state.selectMode = false;
            state.selectedIds.clear();

            document.querySelectorAll('.nav-btn').forEach(btn => btn.className = "nav-btn w-full text-left px-3 py-2 rounded-lg font-medium text-sm flex items-center gap-2 transition text-slate-600 hover:bg-white/40");
            document.getElementById(`nav-${newMode}`).className = "nav-btn w-full text-left px-3 py-2 rounded-lg font-bold text-sm flex items-center gap-2 transition bg-white text-indigo-700 shadow-sm";

            const mainHeader = document.getElementById('main-header');
            const gridContainer = document.getElementById('grid-container');
            const phoneContainer = document.getElementById('phone-app-container');
            const exitBtn = document.getElementById('phone-exit-btn');
            const catArea = document.getElementById('category-area');
            const addCatArea = document.getElementById('add-cat-area');

            if(newMode === 'phone') {
                mainHeader.classList.add('hide'); gridContainer.classList.add('hide'); catArea.classList.add('hide'); addCatArea.classList.add('hide');
                phoneContainer.classList.remove('hide'); phoneContainer.classList.add('flex');
                exitBtn.classList.remove('hide'); 
                applyPhoneFullScreen();
                renderPhone();
                closeSidebar(); 
            } else {
                mainHeader.classList.remove('hide'); gridContainer.classList.remove('hide'); catArea.classList.remove('hide'); addCatArea.classList.remove('hide');
                phoneContainer.classList.add('hide'); phoneContainer.classList.remove('flex');
                exitBtn.classList.add('hide');
                
                document.getElementById('current-category-title').innerText = state[newMode].currentCategory;
                const btnLabels = { pvalue: '添加 P 值', prompt: '创建词包', theater: '添加剧本', web: '添加网址' };
                document.getElementById('btn-add-main').innerText = btnLabels[newMode];
                render();
            }
            if(window.innerWidth < 768 && newMode !== 'phone') closeSidebar();
        }

        function openSidebar() { document.getElementById('sidebar').classList.remove('-translate-x-full'); document.getElementById('sidebar-overlay').classList.remove('hide'); }
        function closeSidebar() { document.getElementById('sidebar').classList.add('-translate-x-full'); document.getElementById('sidebar-overlay').classList.add('hide'); }

        function render() { renderCategories(); renderItems(); updateActionBar(); }

        function renderCategories() {
            const list = document.getElementById('category-list');
            list.innerHTML = '';
            const db = state[state.mode];
            list.appendChild(createCatNode('全部', db.currentCategory === '全部'));
            db.categories.forEach(cat => list.appendChild(createCatNode(cat, db.currentCategory === cat)));
        }

        function createCatNode(name, isActive) {
            const div = document.createElement('div');
            div.className = `flex justify-between items-center px-3 py-2 rounded-xl mb-1 cursor-pointer text-sm ${isActive ? 'bg-white/60 font-bold text-indigo-800 shadow-sm border border-white' : 'hover:bg-white/40 text-slate-700 border border-transparent'}`;
            div.onclick = () => { state[state.mode].currentCategory = name; state.selectMode = false; state.selectedIds.clear(); document.getElementById('current-category-title').innerText = name; render(); if(window.innerWidth<768) closeSidebar(); };
            div.innerHTML = `<span class="pointer-events-none truncate pr-2">${name}</span>`;
            if (name !== '全部' && state[state.mode].categories.length > 1) {
                const btn = document.createElement('button');
                btn.className = 'text-slate-400 hover:text-red-500 p-1 z-10';
                btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                btn.onclick = (e) => {
                    e.stopPropagation();
                    if(confirm('删除此分类？数据将移至第一个分类。')){
                        const db = state[state.mode];
                        db.categories = db.categories.filter(c=>c!==name);
                        db.items.forEach(i=>{if(i.category===name) i.category=db.categories[0];});
                        if(db.currentCategory===name) db.currentCategory='全部';
                        saveData(); render();
                    }
                };
                div.appendChild(btn);
            }
            return div;
        }

        function renderItems() {
            const grid = document.getElementById('item-grid');
            const empty = document.getElementById('empty-state');
            grid.innerHTML = '';
            const db = state[state.mode];
            const items = db.currentCategory === '全部' ? db.items : db.items.filter(i => i.category === db.currentCategory);
            
            if(items.length === 0) { empty.classList.remove('hide'); } 
            else { empty.classList.add('hide'); items.forEach((item, idx) => grid.appendChild(createGenericCard(item, idx, state.mode))); }
        }

        function createGenericCard(item, index, mode) {
            const div = document.createElement('div');
            div.className = `p-card glass-card rounded-2xl overflow-hidden relative cursor-pointer animate-fade-in group flex flex-col h-full ${state.selectedIds.has(item.id) ? 'ring-2 ring-indigo-500 bg-white/80' : ''}`;
            div.style.animationDelay = `${index * 30}ms`;
            div.dataset.id = item.id;

            div.onclick = (e) => {
                if(e.target.closest('.action-btn')) return;
                if(state.selectMode) { toggleSelect(item.id); return; }
                if(mode === 'prompt' || mode === 'theater') openDetailView(item);
                if(mode === 'web') openWebPreview(item.url);
            };

            const checkboxHtml = state.selectMode ? `<div class="absolute top-3 left-3 z-10 w-6 h-6 rounded-full border-2 ${state.selectedIds.has(item.id)?'bg-indigo-500 border-indigo-500 flex items-center justify-center':'bg-white/80 border-slate-300'}">${state.selectedIds.has(item.id)?'<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>':''}</div>` : '';
            
            let imgHtml = item.image ? `<img src="${item.image}" alt="cover">` : `<svg class="w-12 h-12 text-slate-300 drop-shadow-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>`;
            if(mode === 'web' && !item.image) imgHtml = `<div class="text-4xl font-bold text-slate-300">${item.title?item.title.charAt(0):'W'}</div>`;

            let contentHtml = '';
            if (mode === 'pvalue') {
                const disp = item.pvalue.startsWith('--p ') ? item.pvalue : `--p ${item.pvalue}`;
                contentHtml = `<div class="font-mono font-bold text-slate-800 truncate text-lg">${disp}</div><p class="text-sm text-slate-500 truncate mt-1">${item.desc||'暂无'}</p>`;
            } else if (mode === 'prompt' || mode === 'theater') {
                contentHtml = `<h3 class="font-bold text-slate-800 text-lg truncate">${item.title||item.name||'未命名'}</h3><p class="text-xs text-indigo-500 mt-1 font-medium">包含 ${item.contentList ? item.contentList.length : (item.prompts?item.prompts.length:0)} 条内容</p>`;
            } else if (mode === 'web') {
                contentHtml = `<h3 class="font-bold text-slate-800 text-lg truncate">${item.title||'未命名网站'}</h3><p class="text-xs text-blue-500 mt-1 truncate">${item.url}</p>`;
            }

            const actionBtns = `
                <button class="action-btn btn-hover p-1.5 text-slate-400 hover:text-blue-600 bg-white/50 rounded-lg border border-white" onclick="openEditModal('${item.id}')"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></button>
                ${mode==='pvalue' ? `<button class="action-btn btn-hover p-1.5 text-slate-400 hover:text-indigo-600 bg-white/50 rounded-lg border border-white" onclick="copyToClipboard('${item.pvalue.startsWith('--p')?item.pvalue:'--p '+item.pvalue}')"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg></button>` : ''}
            `;

            div.innerHTML = `
                ${checkboxHtml}
                <div class="card-image-container relative border-b border-white/30 pointer-events-none">
                    ${imgHtml}
                    <div class="absolute bottom-2 left-2 text-white text-xs bg-black/40 px-2 py-0.5 rounded backdrop-blur border border-white/20">${item.category}</div>
                </div>
                <div class="p-4 flex-1 flex flex-col justify-between">
                    <div class="mb-2">${contentHtml}</div>
                    <div class="flex justify-end gap-1 mt-2 z-20 relative">${actionBtns}</div>
                </div>
            `;
            return div;
        }

        // --- 全局通用弹窗表单 ---
        function openAddModal() { editingId = null; buildUniversalForm(); }
        function openEditModal(id) { editingId = id; buildUniversalForm(id); }

        function buildUniversalForm(id = null) {
            const db = state[state.mode];
            const item = id ? db.items.find(i=>i.id===id) : null;
            const container = document.getElementById('uni-fields-container');
            
            const titles = {pvalue:'P值', prompt:'词包', theater:'剧本', web:'网页网址'};
            document.getElementById('uni-title').innerText = id ? `编辑 ${titles[state.mode]}` : `添加 ${titles[state.mode]}`;

            const catSelect = document.getElementById('uni-input-category');
            catSelect.innerHTML = '';
            db.categories.forEach(c => catSelect.add(new Option(c,c,false,(item?item.category:db.currentCategory)===c)));

            let fieldsHtml = '';
            if(state.mode === 'pvalue') {
                fieldsHtml = `
                    <div><label class="text-sm font-semibold text-slate-700 block mb-1">P值代码</label><input type="text" id="f-pvalue" class="w-full px-3 py-2 rounded-xl bg-white/70 focus:outline-none focus:ring-2 focus:ring-indigo-400" value="${item?item.pvalue:''}"></div>
                    <div><label class="text-sm font-semibold text-slate-700 block mb-1">备注</label><input type="text" id="f-desc" class="w-full px-3 py-2 rounded-xl bg-white/70 focus:outline-none focus:ring-2 focus:ring-indigo-400" value="${item?item.desc||'':''}"></div>
                    ${getImageUploadHtml(item)}
                `;
            } else if(state.mode === 'prompt' || state.mode === 'theater') {
                fieldsHtml = `
                    <div><label class="text-sm font-semibold text-slate-700 block mb-1">名称/标题</label><input type="text" id="f-title" class="w-full px-3 py-2 rounded-xl bg-white/70 focus:outline-none focus:ring-2 focus:ring-indigo-400" value="${item?item.title||item.name||'':''}"></div>
                    ${getImageUploadHtml(item)}
                    <div class="pt-2 border-t border-white/40"><label class="text-sm font-bold text-slate-800 block mb-2">多段内容 (可无限叠加)</label><div id="f-rows" class="space-y-2"></div><button onclick="addUniRow()" class="mt-2 w-full py-1.5 border border-dashed border-indigo-300 text-indigo-600 rounded-lg text-sm font-medium hover:bg-indigo-50 transition">+ 添加一行</button></div>
                `;
            } else if(state.mode === 'web') {
                fieldsHtml = `
                    <div><label class="text-sm font-semibold text-slate-700 block mb-1">网站名称</label><input type="text" id="f-title" class="w-full px-3 py-2 rounded-xl bg-white/70 focus:outline-none focus:ring-2 focus:ring-indigo-400" value="${item?item.title||'':''}"></div>
                    <div><label class="text-sm font-semibold text-slate-700 block mb-1">完整网址 (带http/https)</label><input type="url" id="f-url" class="w-full px-3 py-2 rounded-xl bg-white/70 focus:outline-none focus:ring-2 focus:ring-indigo-400" value="${item?item.url||'':''}" placeholder="https://..."></div>
                    ${getImageUploadHtml(item)}
                `;
            }
            container.innerHTML = fieldsHtml;

            if(document.getElementById('f-img-input')) {
                document.getElementById('f-img-input').onchange = e => {
                    if(e.target.files[0]){
                        const r = new FileReader(); r.onload=ev=>{ document.getElementById('f-img-preview').src=ev.target.result; document.getElementById('f-img-preview').classList.remove('hide');};
                        r.readAsDataURL(e.target.files[0]);
                    }
                }
            }
            if(document.getElementById('f-rows')) {
                if(item && item.contentList && item.contentList.length>0) item.contentList.forEach(v => addUniRow(v));
                else if (item && item.prompts && item.prompts.length>0) item.prompts.forEach(v => addUniRow(v)); 
                else addUniRow();
            }

            document.getElementById('modal-universal').classList.remove('hide');
        }

        function getImageUploadHtml(item) {
            return `<div><label class="text-sm font-semibold text-slate-700 block mb-1">封面图</label><input type="file" id="f-img-input" accept="image/*" class="text-sm text-slate-500 w-full"><img id="f-img-preview" src="${item&&item.image?item.image:''}" class="mt-2 h-24 w-full object-cover rounded-lg border border-white/50 ${item&&item.image?'':'hide'}"></div>`;
        }

        function addUniRow(val='') {
            const div = document.createElement('div');
            div.className = 'flex gap-2';
            div.innerHTML = `<textarea class="f-row-val flex-1 px-3 py-1.5 rounded-lg bg-white/70 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400 resize-y min-h-[40px]">${val}</textarea><button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-red-500 p-1"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>`;
            document.getElementById('f-rows').appendChild(div);
        }

        function saveUniversal() {
            const db = state[state.mode];
            const cat = document.getElementById('uni-input-category').value;
            let finalImg = null;
            if(document.getElementById('f-img-preview')) {
                const src = document.getElementById('f-img-preview').src;
                if(src.startsWith('data:image')) finalImg = src;
            }
            if(editingId && !finalImg) {
                const old = db.items.find(i=>i.id===editingId); if(old) finalImg = old.image;
            }

            let newItem = { id: editingId || (state.mode + '_' + Date.now()), category: cat, image: finalImg };

            if(state.mode === 'pvalue') {
                const pv = document.getElementById('f-pvalue').value.trim();
                if(!pv) return showToast('P值不能为空');
                newItem.pvalue = pv; newItem.desc = document.getElementById('f-desc').value.trim();
            } else if(state.mode === 'prompt' || state.mode === 'theater') {
                const t = document.getElementById('f-title').value.trim();
                if(!t) return showToast('标题不能为空');
                const list = Array.from(document.querySelectorAll('.f-row-val')).map(el=>el.value.trim()).filter(Boolean);
                if(list.length===0) return showToast('至少填写一行内容');
                newItem.title = t; newItem.contentList = list;
            } else if(state.mode === 'web') {
                const u = document.getElementById('f-url').value.trim();
                if(!u) return showToast('网址不能为空');
                newItem.title = document.getElementById('f-title').value.trim(); newItem.url = u;
            }

            if(editingId) {
                const idx = db.items.findIndex(i=>i.id===editingId);
                if(idx>-1) db.items[idx] = { ...db.items[idx], ...newItem };
            } else { db.items.unshift(newItem); }

            if(db.currentCategory !== '全部') db.currentCategory = cat;
            saveData(); closeModal('modal-universal'); render(); showToast('已保存');
        }

        // --- 独立还原：打开详细查看弹窗（带独立复制按钮） ---
        function openDetailView(item) {
            currentViewingPrompts = item.contentList || item.prompts || [];
            const imgEl = document.getElementById('view-prompt-img');
            if(item.image) {
                imgEl.src = item.image; imgEl.classList.remove('hide', 'hidden');
            } else {
                imgEl.classList.add('hide', 'hidden'); imgEl.src = '';
            }
            document.getElementById('view-prompt-title').innerText = item.title || item.name || '未命名';
            document.getElementById('view-prompt-cat').innerText = item.category;

            const listEl = document.getElementById('view-prompt-list');
            listEl.innerHTML = '';
            currentViewingPrompts.forEach((text, index) => {
                const row = document.createElement('div');
                row.className = "p-3 bg-white/80 rounded-xl border border-white shadow-sm flex items-start gap-3 group animate-fade-in";
                row.style.animationDelay = `${index * 40}ms`;
                row.innerHTML = `
                    <div class="flex-shrink-0 mt-0.5 text-xs font-bold text-indigo-400 bg-indigo-50 px-2 py-1 rounded border border-indigo-100">#${index+1}</div>
                    <p class="text-sm text-slate-700 font-medium break-all flex-1 pt-0.5 whitespace-pre-wrap">${text}</p>
                    <button class="btn-hover text-slate-400 hover:text-indigo-600 bg-white hover:bg-indigo-50 p-1.5 rounded-lg border border-slate-200 transition-all shadow-sm" onclick="copyToClipboard(\`${text.replace(/`/g, '\\`')}\`)" title="复制此段">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </button>
                `;
                listEl.appendChild(row);
            });
            document.getElementById('modal-view-prompt').classList.remove('hide', 'hidden');
        }

        function copyAllPrompts() {
            if(currentViewingPrompts.length === 0) return;
            const fullText = currentViewingPrompts.join('\n\n'); 
            copyToClipboard(fullText, '已一键复制全部内容！');
        }

        function openWebPreview(url) {
            let safeUrl = url;
            if(!safeUrl.startsWith('http')) safeUrl = 'https://' + safeUrl;
            document.getElementById('iframe-url-display').innerText = safeUrl;
            document.getElementById('iframe-open-btn').onclick = () => window.open(safeUrl, '_blank');
            document.getElementById('preview-iframe').src = safeUrl;
            document.getElementById('modal-iframe').classList.remove('hide');
        }

        // --- 多选操作 ---
        function toggleSelectMode() { state.selectMode = !state.selectMode; state.selectedIds.clear(); render(); }
        function selectAll() {
            const db = state[state.mode];
            const items = db.currentCategory === '全部' ? db.items : db.items.filter(i => i.category === db.currentCategory);
            if (state.selectedIds.size === items.length && items.length > 0) state.selectedIds.clear(); 
            else items.forEach(i => state.selectedIds.add(i.id));
            render(); updateActionBar();
        }
        function bulkDelete() {
            if (state.selectedIds.size === 0) return showToast('请先选择');
            if (confirm('确定删除选中项？')) {
                const db = state[state.mode];
                db.items = db.items.filter(i => !state.selectedIds.has(i.id));
                state.selectedIds.clear(); state.selectMode = false; saveData(); render();
            }
        }
        function bulkMove() {
            if(state.selectedIds.size===0) return showToast('请先选择');
            const cat = prompt("输入要移动到的分类名称：\n" + state[state.mode].categories.join(', '));
            if(cat && state[state.mode].categories.includes(cat)){
                state[state.mode].items.forEach(i=>{if(state.selectedIds.has(i.id)) i.category = cat;});
                state.selectedIds.clear(); state.selectMode=false; saveData(); render(); showToast('移动成功');
            } else if(cat) showToast('分类不存在');
        }
        function updateActionBar() {
            const nBar = document.getElementById('normal-action-bar');
            const bBar = document.getElementById('bulk-action-bar');
            if(state.selectMode){ nBar.classList.add('hide'); bBar.classList.remove('hide'); document.getElementById('selected-count').innerText=`已选择 ${state.selectedIds.size} 项`;}
            else { nBar.classList.remove('hide'); bBar.classList.add('hide'); }
        }

        // --- 虚拟手机系统 ---
        function renderPhone() {
            const root = document.getElementById('phone-root');
            if(phoneUIState.screen === 'home') root.innerHTML = getPhoneHomeHtml();
            else if(phoneUIState.screen === 'contacts') root.innerHTML = getPhoneContactsHtml();
            else if(phoneUIState.screen === 'chat') root.innerHTML = getPhoneChatHtml(phoneUIState.activeCharId);
            else if(phoneUIState.screen === 'chat_settings') root.innerHTML = getPhoneChatSettingsHtml(phoneUIState.activeCharId);
            else if(phoneUIState.screen === 'settings') root.innerHTML = getPhoneSettingsHtml();
            else if(phoneUIState.screen === 'settings_theme') root.innerHTML = getPhoneThemeHtml();
            else if(phoneUIState.screen === 'diary') root.innerHTML = getPhoneDiaryHtml();
            
            if(phoneUIState.screen === 'chat') {
                const chatArea = document.getElementById('phone-chat-area');
                if(chatArea) chatArea.scrollTop = chatArea.scrollHeight;
            }
        }

        function setPhoneScreen(screen, charId = null) {
            phoneUIState.screen = screen;
            if(charId !== null) phoneUIState.activeCharId = charId;
            phoneUIState.chatSelectMode = false;
            phoneUIState.selectedChatIds.clear();
            phoneUIState.quotingMsgId = null;
            renderPhone();
        }

        function getAppIconHtml(key, defaultSvg, bgColor) {
            const customImg = state.phone.theme[key];
            if(customImg) return `<div class="w-14 h-14 rounded-2xl overflow-hidden shadow-lg"><img src="${customImg}" class="w-full h-full object-cover"></div>`;
            return `<div class="w-14 h-14 bg-${bgColor} rounded-2xl flex items-center justify-center text-white shadow-lg transition">${defaultSvg}</div>`;
        }

        function getPhoneHomeHtml() {

            const chars = state.phone.characters.map(c => `
                <div class="flex items-center gap-3 p-3 hover:bg-slate-50 cursor-pointer transition border-b border-slate-100" onclick="setPhoneScreen('chat', '${c.id}')">
                    <div class="w-12 h-12 rounded-full bg-slate-200 overflow-hidden flex items-center justify-center text-xl font-bold text-slate-400 shrink-0">

            return `
                <div class="phone-notch"></div>
                <div class="h-16 pt-5 px-4 bg-white flex items-center justify-between border-b shrink-0 z-40 relative">

                    <button onclick="createNewChar()" class="text-blue-500 w-12 flex justify-end"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg></button>
                </div>
                <div class="phone-content bg-white pb-6">${chars}</div>
            `;

        function createNewChar() {
            const newId = 'char_' + Date.now();
            state.phone.characters.push({
                id: newId, name: '新建角色', avatar: '', persona: '', customUserPersona: '', chatBg: '', offlineEnabled: false, offlineMin: 200, offlineMax: 5000
            });

            saveData();
            setPhoneScreen('chat_settings', newId);
        }

            const char = state.phone.characters.find(c=>c.id===charId);

            return `
                <div class="phone-notch"></div>

                    <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-100">
                        <label class="text-xs font-bold text-slate-500 block mb-1">专属 User人设 (在此聊天的你)</label>
                        <textarea id="pc-userpersona" class="w-full text-sm focus:outline-none resize-none h-16" placeholder="选填。留空则使用全局设置中的User人设...">${char.customUserPersona || ''}</textarea>

                    <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-100">
                        <h4 class="font-bold text-slate-800 mb-2 border-b pb-1 flex justify-between items-center">
                            单机/长文模式
                            <button onclick="toggleCharOffline('${charId}')" class="px-2 py-0.5 rounded text-xs ${char.offlineEnabled?'bg-indigo-500 text-white':'bg-slate-200 text-slate-600'}">${char.offlineEnabled?'已开启':'已关闭'}</button>
                        </h4>
                        <div class="flex gap-2 ${char.offlineEnabled?'':'opacity-50 pointer-events-none'}">
                            <div class="flex-1"><label class="text-xs text-slate-500 block">最少字数</label><input type="number" id="pc-off-min" class="w-full text-sm focus:outline-none" value="${char.offlineMin || 200}"></div>

                    <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100">
                        <h4 class="text-xs font-bold text-slate-500 mb-2">专属聊天背景</h4>
                        <div class="flex items-center gap-3">
                            <div class="w-16 h-24 bg-slate-100 rounded-lg overflow-hidden border border-slate-200 relative">

                                <input type="file" id="pc-bg" accept="image/*" class="hide" onchange="updateCharBg(this, '${charId}')">

                    <div class="grid grid-cols-2 gap-2 mt-4">
