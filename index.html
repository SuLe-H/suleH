                        <button onclick="document.getElementById('import-char-file').click()" class="py-2.5 bg-white text-emerald-600 font-bold text-sm rounded-xl shadow-sm border border-slate-100">导入覆盖</button>
                        <input type="file" id="import-char-file" class="hide" accept=".json" onchange="importSingleChar(event, '${charId}')">
                    </div>

                    <button onclick="deletePhoneChar('${charId}')" class="w-full py-3 bg-white text-red-500 font-bold rounded-xl shadow-sm border border-slate-100 mt-2">删除联系人及记录</button>
                </div>
            `;
        }

        function toggleCharOffline(charId) {
            const char = state.phone.characters.find(c=>c.id===charId);
            if(char) {
                char.offlineEnabled = !char.offlineEnabled;
                saveData(); renderPhone();
            }
        }

        function updateCharAvatar(inputEl, charId) {
            if(inputEl.files && inputEl.files[0]) {
                const r = new FileReader(); r.onload = e => { 
                    const char = state.phone.characters.find(c=>c.id===charId);
                    if(char) { char.avatar = e.target.result; saveData(); renderPhone(); }
                }; r.readAsDataURL(inputEl.files[0]);
            }
        }
        function updateCharBg(inputEl, charId) {
            const char = state.phone.characters.find(c=>c.id===charId);
            if(!char) return;
            if(inputEl === null) { char.chatBg = ''; saveData(); renderPhone(); return; }
            if(inputEl.files && inputEl.files[0]) {
                const r = new FileReader(); r.onload = e => { char.chatBg = e.target.result; saveData(); renderPhone(); }; r.readAsDataURL(inputEl.files[0]);
            }
        }
        function savePhoneChar(id) {
            const name = document.getElementById('pc-name').value.trim();
            if(!name) return alert('姓名不能为空');
            const char = state.phone.characters.find(c=>c.id===id);
            if(char) {
                char.name = name;
                char.persona = document.getElementById('pc-persona').value.trim();
                char.customUserPersona = document.getElementById('pc-userpersona').value.trim();
                char.offlineMin = parseInt(document.getElementById('pc-off-min').value) || 200;
                char.offlineMax = parseInt(document.getElementById('pc-off-max').value) || 5000;
                saveData();
                setPhoneScreen('chat', id);
            }
        }
        function deletePhoneChar(id) {
            if(confirm('确定删除此联系人及其所有聊天记录？不可恢复！')) {
                state.phone.characters = state.phone.characters.filter(c=>c.id!==id);
                delete state.phone.chats[id];
                saveData(); setPhoneScreen('contacts');
            }
        }
        function exportSingleChar(charId) {
            const char = state.phone.characters.find(c=>c.id===charId);
            const chats = state.phone.chats[charId] || [];
            const data = { char, chats };
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `Char_${char.name}_${new Date().getTime()}.json`;
            a.click(); URL.revokeObjectURL(url);
        }
        function importSingleChar(e, currentId) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                try {
                    const parsed = JSON.parse(ev.target.result);
                    if(parsed.char && parsed.chats) {
                        if(confirm('导入将覆盖当前角色的所有人设和聊天记录，是否继续？')) {
                            parsed.char.id = currentId;
                            const idx = state.phone.characters.findIndex(c=>c.id===currentId);
                            if(idx>-1) state.phone.characters[idx] = parsed.char;
                            state.phone.chats[currentId] = parsed.chats;
                            saveData(); renderPhone(); showToast('导入成功');
                        }
                    } else { alert('文件格式不正确（缺少 char 或 chats）'); }
                } catch(err) { alert('文件解析失败！'); }
            };
            reader.readAsText(file);
        }

        let pressTimer = null;
        function tStart(e, id) { pressTimer = setTimeout(() => openMsgContextMenu(id), 500); }
        function tMove() { clearTimeout(pressTimer); }
        function tEnd() { clearTimeout(pressTimer); }

        function openMsgContextMenu(id) { phoneUIState.contextMsgId = id; document.getElementById('modal-msg-context').classList.remove('hide'); }
        function closeMsgContextMenu() { phoneUIState.contextMsgId = null; document.getElementById('modal-msg-context').classList.add('hide'); }

        function msgActionCopy() {
            const charId = phoneUIState.activeCharId;
            const msg = state.phone.chats[charId].find(m=>m.id === phoneUIState.contextMsgId);
            if(msg) copyToClipboard(msg.content);
            closeMsgContextMenu();
        }
        function msgActionQuote() { phoneUIState.quotingMsgId = phoneUIState.contextMsgId; closeMsgContextMenu(); renderPhone(); }
        function msgActionDelete() {
            const charId = phoneUIState.activeCharId;
            state.phone.chats[charId] = state.phone.chats[charId].filter(m => m.id !== phoneUIState.contextMsgId);
            saveData(); closeMsgContextMenu(); renderPhone();
        }
        function msgActionSelect() {
            phoneUIState.chatSelectMode = true; phoneUIState.selectedChatIds.clear();
            phoneUIState.selectedChatIds.add(phoneUIState.contextMsgId);
            closeMsgContextMenu(); renderPhone();
        }
        function cancelChatSelect() { phoneUIState.chatSelectMode = false; phoneUIState.selectedChatIds.clear(); renderPhone(); }
        function toggleChatSelect(id) {
            if(phoneUIState.selectedChatIds.has(id)) phoneUIState.selectedChatIds.delete(id); else phoneUIState.selectedChatIds.add(id);
            renderPhone();
        }
        function deleteSelectedChats() {
            if(phoneUIState.selectedChatIds.size === 0) return;
            const charId = phoneUIState.activeCharId;
            state.phone.chats[charId] = state.phone.chats[charId].filter(m => !phoneUIState.selectedChatIds.has(m.id));
            saveData(); cancelChatSelect();
        }
        function cancelQuote() { phoneUIState.quotingMsgId = null; renderPhone(); }

        function getPhoneChatHtml(charId) {
            const char = state.phone.characters.find(c=>c.id===charId);
            const chats = state.phone.chats[charId] || [];
            
            const bubbles = chats.map(msg => {
                const isUser = msg.role === 'user';
                const bubbleClass = isUser ? 'bubble-right' : 'bubble-left';
                const pressEvents = `onmousedown="tStart(event, '${msg.id}')" onmousemove="tMove()" onmouseup="tEnd()" onmouseleave="tEnd()" ontouchstart="tStart(event, '${msg.id}')" ontouchmove="tMove()" ontouchend="tEnd()"`;
                
                let bubbleHtml = `<div class="${bubbleClass}" ${pressEvents}>${msg.content}</div>`;
                
                if(phoneUIState.chatSelectMode) {
                    const isSel = phoneUIState.selectedChatIds.has(msg.id);
                    const checkbox = `<div class="w-6 h-6 shrink-0 rounded-full border-2 flex items-center justify-center mx-2 ${isSel?'bg-indigo-500 border-indigo-500':'border-slate-300 bg-white'}" onclick="toggleChatSelect('${msg.id}')">${isSel?'<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>':''}</div>`;
                    bubbleHtml = `<div class="flex items-center w-full">${checkbox} ${bubbleHtml}</div>`;
                }

                return `<div class="flex ${isUser && !phoneUIState.chatSelectMode ?'justify-end':'justify-start'} mb-3 w-full">${bubbleHtml}</div>`;
            }).join('');

            let quoteBanner = '';
            if(phoneUIState.quotingMsgId) {
                const qMsg = chats.find(m=>m.id === phoneUIState.quotingMsgId);
                if(qMsg) {
                    quoteBanner = `
                        <div class="absolute bottom-[52px] left-0 right-0 bg-slate-100/90 backdrop-blur px-3 py-1.5 flex items-center justify-between border-t border-slate-200 z-30">
                            <span class="text-xs text-slate-500 truncate flex-1">引用: ${qMsg.content.substring(0, 30)}...</span>
                            <button onclick="cancelQuote()" class="text-slate-400 hover:text-red-500 ml-2 p-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                        </div>
                    `;
                }
            }

            let bottomBar = '';
            if(phoneUIState.chatSelectMode) {
                bottomBar = `
                    <div class="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-4 py-3 flex justify-between z-40">
                        <button onclick="cancelChatSelect()" class="text-slate-500 font-medium">取消</button>
                        <button onclick="deleteSelectedChats()" class="text-red-500 font-bold flex items-center gap-1"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg> 删除选中</button>
                    </div>
                `;
            } else {
                const sparklesIcon = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>`;
                bottomBar = `
                    <div class="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-3 py-2 flex items-end gap-2 z-40">
                        <button onclick="triggerAIReply('${charId}')" class="p-2 mb-1 rounded-full text-indigo-500 hover:bg-indigo-50 transition" title="让 AI 回复">${sparklesIcon}</button>
                        <textarea id="chat-input" class="flex-1 max-h-24 h-10 min-h-[40px] bg-slate-100 rounded-xl px-3 py-2 text-sm focus:outline-none resize-none" placeholder="发消息..."></textarea>
                        <button onclick="sendUserMessage('${charId}')" class="mb-1 p-2 bg-blue-500 text-white rounded-full transition hover:bg-blue-600"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg></button>
                    </div>
                `;
            }

            const bgStyle = char.chatBg ? `background-image: url('${char.chatBg}'); background-size: cover; background-position: center;` : '';
            const bgClass = char.chatBg ? '' : 'bg-slate-50';
            const offline = char.offlineEnabled;

            return `
                <div class="phone-notch"></div>
                <div class="h-16 pt-5 px-4 bg-slate-100/90 backdrop-blur flex items-center justify-between border-b shrink-0 z-40 relative">
                    <button onclick="setPhoneScreen('contacts')" class="text-blue-500 flex items-center w-10 text-left"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></button>
                    <span class="font-bold flex-1 text-center truncate px-2">${char.name}</span>
                    <button class="text-slate-400 w-10 flex justify-end" onclick="setPhoneScreen('chat_settings', '${charId}')"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg></button>
                </div>
                <div id="phone-chat-area" class="phone-content ${bgClass} p-4 pb-[80px]" style="${bgStyle}">
                    ${offline ? `<div class="text-center text-xs text-slate-400 mb-4 bg-white/50 backdrop-blur rounded-full py-1 w-max mx-auto px-3">当前为单机/长文模式</div>` : ''}
                    ${bubbles}
                    <div id="chat-loading" class="hide flex justify-start mb-3"><div class="bubble-left flex items-center gap-2"><div class="loader"></div> 正在输入...</div></div>
                </div>
                ${quoteBanner}
                ${bottomBar}
            `;
        }

        function sendUserMessage(charId) {
            const inputEl = document.getElementById('chat-input');
            let content = inputEl.value.trim();
            if(!content) return;

            if(phoneUIState.quotingMsgId) {
                const qMsg = state.phone.chats[charId].find(m=>m.id === phoneUIState.quotingMsgId);
                if(qMsg) content = `「${qMsg.content.substring(0,20)}...」\n${content}`;
                phoneUIState.quotingMsgId = null;
            }
            
            if(!state.phone.chats[charId]) state.phone.chats[charId] = [];
            state.phone.chats[charId].push({id: 'msg_'+Date.now()+'_'+Math.random().toString(36).substr(2,5), role: 'user', content});
            saveData(); renderPhone();
        }

        async function triggerAIReply(charId) {
            const char = state.phone.characters.find(c=>c.id===charId);
            const offline = char.offlineEnabled;
            const api = state.phone.api;
            
            if(!api.key) return alert('请先在全局设置中填写 API Key');

            document.getElementById('chat-loading').classList.remove('hide');
            const chatArea = document.getElementById('phone-chat-area');
            chatArea.scrollTop = chatArea.scrollHeight;

            const activeUserPersona = char.customUserPersona || state.phone.userPersona || '无特定设定，正常对待即可';

            let sysPrompt = `你的角色设定：\n${char.persona}\n\n当前用户的设定：\n${activeUserPersona}\n\n`;
            if(offline) sysPrompt += `【强制系统规则：线下长文模式】\n你必须只回复1条完整的消息，绝对不要切分。你的回复字数必须在 ${char.offlineMin || 200} 到 ${char.offlineMax || 5000} 字之间。不要使用任何分隔符。`;
            else sysPrompt += `【强制系统规则：真实聊天模式】\n你需要把回复拆分成 1 到 5 条短消息，模拟真实人类的断句聊天节奏。绝对不要把所有话放在一个长段落里！\n你必须使用特殊符号 \`|||\` 来分隔你的每条气泡消息。\n例如：你好呀！|||今天天气真不错，要一起出去玩吗？|||等你回复哦。`;

            const safeHistory = (state.phone.chats[charId] || []).map(m => ({role: m.role, content: m.content}));
            const messages = [{ role: 'system', content: sysPrompt }, ...safeHistory];

            try {
                const res = await fetch(`${api.baseUrl.replace(/\/+$/, '')}/chat/completions`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${api.key}` },
                    body: JSON.stringify({ model: api.model, messages: messages, temperature: 0.7 })
                });
                
                if(!res.ok) throw new Error(`API 错误: ${res.status}`);
                const data = await res.json();
                const reply = data.choices[0].message.content;

                let bubbles = offline ? [reply.replace(/\|\|\|/g, '')] : reply.split('|||').map(s=>s.trim()).filter(Boolean);
                if(bubbles.length === 0) bubbles = [reply];

                bubbles.forEach((b, i) => {
                    state.phone.chats[charId].push({
                        id: 'msg_ai_'+Date.now()+'_'+i,
                        role: 'assistant', 
                        content: b
                    });
                });
                saveData(); renderPhone();
            } catch (err) {
                alert("请求失败: " + err.message); document.getElementById('chat-loading').classList.add('hide');
            }
        }

        async function fetchModels() {
            const baseUrl = document.getElementById('set-baseurl').value.trim();
            const key = document.getElementById('set-key').value.trim();
            if(!baseUrl || !key) return alert('请先输入 Base URL 和 API Key');
            
            const btn = document.getElementById('fetch-model-btn');
            btn.innerText = '拉取中...';
            try {
                const res = await fetch(`${baseUrl.replace(/\/+$/, '')}/models`, {
                    headers: { 'Authorization': `Bearer ${key}` }
                });
                if(!res.ok) throw new Error('拉取失败');
                const data = await res.json();
                let models = [];
                if(data.data && Array.isArray(data.data)) models = data.data.map(m => m.id);
                if(models.length > 0) {
                    const sel = document.getElementById('set-model-select');
                    const inp = document.getElementById('set-model');
                    sel.innerHTML = models.map(m => `<option value="${m}">${m}</option>`).join('');
                    sel.classList.remove('hide', 'hidden');
                    inp.classList.add('hide', 'hidden');
                    if(models.includes(inp.value)) sel.value = inp.value;
                } else { alert('未获取到模型列表'); }
            } catch(e) {
                alert('获取模型失败: ' + e.message);
            } finally { btn.innerText = '拉取模型'; }
        }

        function toggleFullScreen() {
            state.phone.settings.fullScreen = !state.phone.settings.fullScreen;
            saveData(); applyPhoneFullScreen(); setPhoneScreen('settings'); 
        }

        function getPhoneSettingsHtml() {
            const api = state.phone.api;
            const off = state.phone.settings;
            return `
                <div class="phone-notch"></div>
                <div class="h-16 pt-5 px-4 bg-white flex items-center justify-between border-b shrink-0 z-40 relative">
                    <button onclick="setPhoneScreen('home')" class="text-blue-500 font-medium">返回</button>
                    <span class="font-bold">全局设置</span>
                    <button onclick="savePhoneSettings()" class="text-blue-500 font-bold">保存</button>
                </div>
                <div class="phone-content bg-slate-50 p-4 space-y-4 pb-10">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                        <button onclick="setPhoneScreen('settings_theme')" class="w-full p-4 flex items-center justify-between hover:bg-slate-50 transition">
                            <div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-pink-100 text-pink-500 flex items-center justify-center"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2v12a2 2 0 002 2z"></path></svg></div><span class="font-bold text-slate-700">主题与美化</span></div>
                            <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>

                    <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-100">
                        <h4 class="font-bold text-slate-800 mb-2 border-b pb-1 flex justify-between items-center">
                            手机全屏无边框
                            <button onclick="toggleFullScreen()" class="px-2 py-0.5 rounded text-xs ${off.fullScreen?'bg-indigo-500 text-white':'bg-slate-200 text-slate-600'}">${off.fullScreen?'已开启':'已关闭'}</button>
                        </h4>
                        <p class="text-[10px] text-slate-400">开启后将去掉黑边框，完全铺满屏幕区域。</p>
                    </div>

                    <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-100">
                        <h4 class="font-bold text-slate-800 mb-2 border-b pb-1">API 设置</h4>
                        <label class="text-xs text-slate-500 block">Base URL</label>
                        <input type="text" id="set-baseurl" class="w-full text-sm mb-2 focus:outline-none" value="${api.baseUrl}">
                        <label class="text-xs text-slate-500 block">API Key</label>
                        <input type="password" id="set-key" class="w-full text-sm mb-2 focus:outline-none" value="${api.key}" placeholder="sk-...">
                        
                        <div class="flex items-center justify-between mb-1">
                            <label class="text-xs text-slate-500 block">模型</label>
                            <button id="fetch-model-btn" onclick="fetchModels()" class="text-xs text-blue-500 font-bold bg-blue-50 px-2 py-0.5 rounded">拉取模型</button>
                        </div>
                        <input type="text" id="set-model" class="w-full text-sm focus:outline-none" value="${api.model}">
                        <select id="set-model-select" class="w-full text-sm focus:outline-none hide py-1 bg-slate-50 rounded"></select>
                    </div>

                    <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-100">
                        <h4 class="font-bold text-slate-800 mb-2 border-b pb-1">默认全局 User 人设</h4>
                        <textarea id="set-user" class="w-full text-sm h-20 focus:outline-none resize-none" placeholder="我是谁，我的名字是...">${state.phone.userPersona}</textarea>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="exportData()" class="py-2 bg-white text-indigo-600 font-bold rounded-xl shadow-sm border border-slate-100">导出系统全数据</button>
                        <button onclick="document.getElementById('import-file').click()" class="py-2 bg-white text-emerald-600 font-bold rounded-xl shadow-sm border border-slate-100">导入覆盖系统</button>
                        <input type="file" id="import-file" class="hide" accept=".json" onchange="importData(event)">
                    </div>
                </div>
            `;
        }

        function getPhoneThemeHtml() {
            const t = state.phone.theme;
            return `
                <div class="phone-notch"></div>
                <div class="h-16 pt-5 px-4 bg-white flex items-center justify-between border-b shrink-0 z-40 relative">
                    <button onclick="setPhoneScreen('settings')" class="text-blue-500 font-medium">返回</button>
                    <span class="font-bold">主题与美化</span>
                    <div class="w-8"></div>
                </div>
                <div class="phone-content bg-slate-50 p-4 space-y-4">
                    <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 text-center">
                        <h4 class="font-bold text-slate-800 mb-2">主屏幕壁纸</h4>
                        <div class="w-32 h-56 mx-auto bg-slate-100 rounded-xl overflow-hidden mb-3 border relative">
                            ${t.wallpaper ? `<img src="${t.wallpaper}" class="w-full h-full object-cover">` : `<div class="flex items-center justify-center h-full text-slate-400 text-xs">默认纯色</div>`}
                        </div>
                        <input type="file" id="th-wallpaper" accept="image/*" class="hide" onchange="updateThemeImg('wallpaper', this)">
                        <div class="flex gap-2 justify-center">
                            <button onclick="document.getElementById('th-wallpaper').click()" class="px-3 py-1.5 bg-blue-50 text-blue-600 text-sm font-bold rounded-lg">上传壁纸</button>
                            <button onclick="updateThemeImg('wallpaper', null)" class="px-3 py-1.5 bg-slate-100 text-slate-600 text-sm font-bold rounded-lg">恢复默认</button>
                        </div>
                    </div>
                    <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100">
                        <h4 class="font-bold text-slate-800 mb-3 text-center">自定义应用图标</h4>
                        <div class="space-y-4">
                            ${getThemeIconUploader('通讯录', 'iconContacts', t.iconContacts)}
                            ${getThemeIconUploader('日记', 'iconDiary', t.iconDiary)}
                            ${getThemeIconUploader('设置', 'iconSettings', t.iconSettings)}
                        </div>
                    </div>
                </div>
            `;
        }

        function getThemeIconUploader(label, key, val) {
            return `
                <div class="flex items-center justify-between border-b border-slate-50 pb-2">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-slate-100 rounded-xl overflow-hidden border">
                            ${val ? `<img src="${val}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-slate-300"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg></div>`}
                        </div>
                        <span class="text-sm font-medium text-slate-700">${label}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="file" id="th-${key}" accept="image/*" class="hide" onchange="updateThemeImg('${key}', this)">
                        <button onclick="document.getElementById('th-${key}').click()" class="text-xs text-blue-600 font-bold bg-blue-50 px-2 py-1 rounded">更换</button>
                        <button onclick="updateThemeImg('${key}', null)" class="text-xs text-slate-400 hover:text-slate-600">重置</button>
                    </div>
                </div>
            `;
        }

        function getPhoneDiaryHtml() {
            const list = state.phone.diaries.map(d => {
                const char = state.phone.characters.find(c=>c.id===d.charId);
                if(!char) return '';
                return `
                    <div class="bg-white p-4 mb-3 border-b border-slate-100 cursor-pointer hover:bg-slate-50" onclick="viewPhoneDiary('${d.id}')">
                        <div class="flex items-center gap-3 mb-2">
                            <img src="${char.avatar||''}" class="w-10 h-10 rounded-full object-cover bg-slate-200">
                            <div><div class="font-bold text-slate-800 text-sm">${char.name}</div><div class="text-xs text-slate-400">${d.date}</div></div>
                        </div>
                        <p class="text-sm text-slate-600 line-clamp-3">${d.content}</p>
                    </div>
                `;
            }).join('');

            return `
                <div class="phone-notch"></div>
                <div class="h-16 pt-5 px-4 bg-slate-100/90 backdrop-blur flex items-center justify-between border-b shrink-0 z-40 relative">
                    <button onclick="setPhoneScreen('home')" class="text-blue-500 font-medium">返回</button>
                    <span class="font-bold">朋友圈 / 日记</span>
                    <button id="btn-refresh-diary" onclick="generateDiaries()" class="text-slate-600 hover:text-indigo-600"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg></button>
                </div>
                <div class="phone-content bg-slate-50 pb-6 relative">
                    <div id="diary-loading" class="hide absolute inset-0 bg-white/80 backdrop-blur z-10 flex flex-col items-center justify-center">
                        <div class="loader mb-2 w-8 h-8 border-4 border-t-indigo-600"></div><p class="text-sm font-bold text-slate-600">API 正在编写日记，请耐心等待...</p>
                    </div>
                    ${list || `<div class="text-center text-slate-400 text-sm mt-10">暂无动态，点击右上角生成</div>`}
                </div>
            `;
        }

        function updateThemeImg(key, inputEl) {
            if(inputEl === null) { state.phone.theme[key] = ''; saveData(); renderPhone(); return; }
            if(inputEl.files && inputEl.files[0]) {
                const r = new FileReader();
                r.onload = e => { state.phone.theme[key] = e.target.result; saveData(); renderPhone(); };
                r.readAsDataURL(inputEl.files[0]);
            }
        }

        function savePhoneSettings() {
            state.phone.api.baseUrl = document.getElementById('set-baseurl').value.trim();
            state.phone.api.key = document.getElementById('set-key').value.trim();
            
            const sel = document.getElementById('set-model-select');
            if(!sel.classList.contains('hide') && !sel.classList.contains('hidden')) {
                state.phone.api.model = sel.value;
            } else {
                state.phone.api.model = document.getElementById('set-model').value.trim();
            }

            state.phone.userPersona = document.getElementById('set-user').value.trim();
            saveData(); showToast('全局设置已保存'); setPhoneScreen('home');
        }

        async function generateDiaries() {
            const api = state.phone.api;
            if(!api.key) return alert('请先在设置中填写 API Key');
            if(state.phone.characters.length === 0) return alert('通讯录为空，请先添加联系人');

            document.getElementById('diary-loading').classList.remove('hide');

            let contextText = `【全局用户(User)设定】\n${state.phone.userPersona || '无特定设定'}\n\n【角色列表与近期互动】\n`;
            state.phone.characters.forEach(c => {
                contextText += `--- 角色ID: ${c.id} ---\n姓名: ${c.name}\n角色自身设定: ${c.persona}\n对User设定的看法(如有): ${c.customUserPersona}\n最近聊天记录:\n`;
                const chats = state.phone.chats[c.id] || [];
                const recent = chats.slice(-6);
                if(recent.length === 0) contextText += `(无聊天记录)\n`;
                else recent.forEach(m => { contextText += `${m.role==='user'?'User':c.name}: ${m.content.substring(0, 50)}...\n`; });
            });

            const sysPrompt = `你是一个日记/朋友圈生成系统。根据给出的角色、用户设定以及近期聊天记录，生成不少于5条日记内容（必须由现有角色撰写，不能是User）。
要求：
1. 每条日记需符合撰写角色的性格，可以是对今天聊天的感想，或者他们各自在做的事情。
2. 必须生成不少于5条。可以同一个角色发多条，也可以不同角色发。
3. 请严格返回合法的JSON数组格式，不要包含任何markdown标记如\`\`\`json，直接输出纯数组即可：
[
  { "charId": "对应的角色ID", "content": "日记正文（50-200字即可）" }
]`;

            try {
                const res = await fetch(`${api.baseUrl.replace(/\/+$/, '')}/chat/completions`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${api.key}` },
                    body: JSON.stringify({ model: api.model, messages: [{role: 'system', content: sysPrompt}, {role: 'user', content: contextText}], temperature: 0.8 })
                });
                
                if(!res.ok) throw new Error(`API 错误: ${res.status}`);
                const data = await res.json();
                const reply = data.choices[0].message.content;

                const match = reply.match(/\[[\s\S]*\]/);
                if(!match) throw new Error('解析生成内容失败，模型未返回合法数组');
                const newDiaries = JSON.parse(match[0]);

                if(Array.isArray(newDiaries) && newDiaries.length > 0) {
                    const dateStr = new Date().toLocaleTimeString('zh-CN', {month:'short', day:'numeric', hour: '2-digit', minute:'2-digit'});
                    newDiaries.reverse().forEach(d => {
                        if(d.charId && d.content) {
                            state.phone.diaries.unshift({ id: 'd_'+Date.now()+Math.random(), charId: d.charId, content: d.content, date: dateStr });
                        }
                    });
                    saveData();
                } else { throw new Error('生成的日记为空'); }
            } catch (err) {
                alert("生成失败: " + err.message);
            } finally { renderPhone(); }
        }

        function viewPhoneDiary(id) {
            const d = state.phone.diaries.find(x=>x.id===id);
            if(!d) return;
            const char = state.phone.characters.find(c=>c.id===d.charId);
            document.getElementById('dd-avatar').src = char.avatar || '';
            document.getElementById('dd-name').innerText = char.name;
            document.getElementById('dd-date').innerText = d.date;
            document.getElementById('dd-content').innerText = d.content;
            document.getElementById('modal-diary-detail').classList.remove('hide');
        }

        function exportData() {
            const dataStr = JSON.stringify(state, null, 2);
            const blob = new Blob([dataStr], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `MJ_Terminal_Full_Backup_${new Date().getTime()}.json`;
            a.click(); URL.revokeObjectURL(url);
        }
        function importData(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                try {
                    const parsed = JSON.parse(ev.target.result);
                    if(confirm('导入将覆盖当前系统的所有数据，是否继续？')) { state = { ...state, ...parsed }; saveData(); alert('导入成功！'); location.reload(); }
                } catch(err) { alert('文件格式错误！'); }
            };
            reader.readAsText(file);
        }

        function copyToClipboard(text, successMsg = null) {
            const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); showToast(successMsg || '复制成功'); } catch (err) {} finally { document.body.removeChild(ta); }
        }
        function closeModal(id) { document.getElementById(id).classList.add('hide'); }
        
        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toast'); toast.innerText = msg;
            toast.classList.remove('opacity-0', 'translate-y-4'); toast.classList.add('translate-y-0');
            clearTimeout(toastTimeout); toastTimeout = setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-4'); toast.classList.remove('translate-y-0'); }, 2500);
        }

        window.onload = init;
    </script>
</body>
</html>
